name: Test du jeu

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Démarrage et nouvelle partie
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Test de fumée
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-test
          path: smoke/
          if-no-files-found: ignore

  quests:
    name: Toutes les quêtes (histoire, habitants, petits boulots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Test des quêtes
        run: npm run test:quests
