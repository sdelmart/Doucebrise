name: Démo en ligne

# Version jouable dans le navigateur, publiée sur GitHub Pages à chaque envoi sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # La démo en ligne n'embarque pas les chansons du dossier music/ : le jeu joue
      # sa musique générée (et « Ma musique » reste disponible dans les paramètres).
      - name: Retirer les chansons
        run: find music -mindepth 2 -type f ! -name '*.json' -delete
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
