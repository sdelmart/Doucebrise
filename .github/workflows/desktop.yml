name: Applications Windows, macOS et Linux

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win --x64
            files: |
              release/*.exe
              release/*.tar.gz
          - os: macos-latest
            name: macOS
            args: --mac --universal
            files: |
              release/*.dmg
              release/*.tar.gz
          - os: ubuntu-latest
            name: Linux
            args: --linux --x64
            files: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Construire l'application
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Doucebrise-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Publier la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
